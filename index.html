<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicologia Gestão Clínica</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        :root {
            --color-primary: #0284c7;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease;
        }

        .animation-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .dark { background-color: #020617; color: #f8fafc; }
        
        /* Estilos de Impressão */
        @media print {
            .no-print { display: none !important; }
            .print-area { 
                display: block !important; 
                position: absolute; 
                top: 0; 
                left: 0; 
                width: 100%; 
                color: black !important; 
                background: white !important; 
                padding: 0 !important;
                margin: 0 !important;
            }
            body { background: white !important; color: black !important; }
            .receipt-container { 
                border: 2px solid #000 !important; 
                padding: 40px !important;
                color: black !important;
                background: white !important;
            }
            .receipt-container * { color: black !important; }
        }

        .card { @apply bg-white dark:bg-gray-800 rounded-3xl border border-gray-200 dark:border-gray-700 shadow-sm; }
        
        /* TEXTO SEMPRE ESCURO NOS CAMPOS (Mesmo no Dark Mode) */
        .input-field { 
            @apply p-3 bg-gray-50 dark:bg-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/50 border border-transparent dark:border-gray-400 transition-all text-gray-900 font-medium;
        }

        /* Ajuste para o texto do nome do paciente no topo da ficha */
        .patient-title-input {
            @apply text-3xl sm:text-4xl font-black w-full bg-transparent border-none focus:ring-0 mb-8 text-gray-900 dark:bg-gray-200 rounded-xl px-4 py-2 placeholder-gray-500;
        }

        /* Evoluções com fundo claro para leitura em preto */
        .evolution-box {
            @apply p-6 bg-gray-50 dark:bg-gray-200 rounded-2xl relative group;
        }

        .input-label { @apply text-[10px] font-bold opacity-50 dark:opacity-100 uppercase tracking-widest mb-1 ml-1 text-gray-600 dark:text-gray-400; }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 12px;
            background: #10b981;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .color-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .color-dot:hover { transform: scale(1.1); }
        
        .receipt-container { font-family: 'Inter', sans-serif; }
        .receipt-title { font-family: 'Playfair Display', serif; }

        textarea.input-field {
            @apply min-h-[100px];
        }

        /* Força a cor escura em todos os inputs e textareas dentro do dark mode */
        .dark input, .dark textarea, .dark select {
            color: #111827 !important; /* gray-900 */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ÍCONES SVG ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                users: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 1-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
                calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
                video: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 8-6 4 6 4V8Z"></path><rect x="2" y="6" width="14" height="12" rx="2" ry="2"></rect></svg>,
                settings: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1-2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"></path></svg>,
                plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
                trash: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
                save: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                camera: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
                moon: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
                sun: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
                arrowLeft: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>,
                print: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            };
            return <span className={`inline-flex items-center justify-center ${className}`}>{icons[name] || null}</span>;
        };

        // --- TEMAS ---
        const THEMES = {
            azul: { color: '#0284c7', label: 'Céu Azul' },
            verde: { color: '#0d9488', label: 'Esmeralda' },
            lavanda: { color: '#8b5cf6', label: 'Ametista' },
            rose: { color: '#e11d48', label: 'Pétala' },
            cinza: { color: '#4b5563', label: 'Ardósia' }
        };

        // --- COMPONENTES UI ---
        const Button = ({ children, onClick, variant = 'primary', icon, className = "", type = "button" }) => {
            const base = "flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-semibold transition-all active:scale-95";
            const variants = {
                primary: "text-white shadow-md hover:opacity-90",
                outline: "border border-gray-300 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800",
                danger: "bg-red-500 text-white hover:bg-red-600",
                success: "bg-emerald-500 text-white hover:bg-emerald-600"
            };
            const style = variant === 'primary' ? { backgroundColor: 'var(--color-primary)' } : {};
            return (
                <button type={type} onClick={onClick} className={`${base} ${variants[variant]} ${className}`} style={style}>
                    {icon && <Icon name={icon} size={18} />}
                    {children}
                </button>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [view, setView] = useState('pacientes');
            const [patients, setPatients] = useState(() => JSON.parse(localStorage.getItem('psigestao_pacientes_v7') || '[]'));
            const [appointments, setAppointments] = useState(() => JSON.parse(localStorage.getItem('psigestao_agenda_v7') || '[]'));
            const [settings, setSettings] = useState(() => JSON.parse(localStorage.getItem('psigestao_config_v7') || '{"theme":"azul","darkMode":false}'));
            const [admin, setAdmin] = useState(() => JSON.parse(localStorage.getItem('psigestao_admin_v7') || '{"nome":"Alessandra Bernardes","crp":"00/00000","foto":null,"cidade":"São Paulo"}'));
            
            const [selectedPatientId, setSelectedPatientId] = useState(null);
            const [activeVideo, setActiveVideo] = useState(null);
            const [toast, setToast] = useState(null);
            const [printModal, setPrintModal] = useState({ open: false, data: null });

            const fileInputRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('psigestao_pacientes_v7', JSON.stringify(patients));
                localStorage.setItem('psigestao_agenda_v7', JSON.stringify(appointments));
                localStorage.setItem('psigestao_config_v7', JSON.stringify(settings));
                localStorage.setItem('psigestao_admin_v7', JSON.stringify(admin));

                document.documentElement.style.setProperty('--color-primary', THEMES[settings.theme].color);
                settings.darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
            }, [patients, appointments, settings, admin]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            const renderSidebar = () => (
                <aside className="w-64 bg-white dark:bg-gray-900 border-r dark:border-gray-800 flex flex-col no-print shrink-0">
                    <div className="p-8 flex flex-col items-center border-b dark:border-gray-800">
                        <div className="w-20 h-20 rounded-full overflow-hidden mb-4 bg-gray-100 dark:bg-gray-800 flex items-center justify-center border-2 border-gray-200 dark:border-gray-700 shadow-inner">
                            {admin.foto ? <img src={admin.foto} className="w-full h-full object-cover" /> : <Icon name="users" size={32} className="opacity-20 text-gray-500" />}
                        </div>
                        <h1 className="font-bold text-center text-sm" style={{color: 'var(--color-primary)'}}>{admin.nome}</h1>
                        <p className="text-[10px] uppercase tracking-widest opacity-40 font-bold mt-1 text-gray-600 dark:text-gray-400">Psicóloga Clínica</p>
                    </div>

                    <nav className="p-4 space-y-2 flex-1">
                        {[
                            { id: 'pacientes', icon: 'users', label: 'Pacientes' },
                            { id: 'agenda', icon: 'calendar', label: 'Agenda' },
                            { id: 'video', icon: 'video', label: 'Teleconsulta' },
                            { id: 'perfil', icon: 'settings', label: 'Definições' }
                        ].map(item => (
                            <button
                                key={item.id}
                                onClick={() => { setView(item.id); setSelectedPatientId(null); }}
                                className={`w-full flex items-center gap-3 p-3.5 rounded-2xl transition-all ${view === item.id ? 'text-white shadow-lg' : 'opacity-60 hover:opacity-100 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`}
                                style={view === item.id ? { backgroundColor: 'var(--color-primary)' } : {}}
                            >
                                <Icon name={item.icon} />
                                <span className="font-bold text-sm">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                </aside>
            );

            const renderContent = () => {
                if (selectedPatientId) {
                    const p = patients.find(x => x.id === selectedPatientId);
                    return <PatientFile 
                        patient={p} 
                        onBack={() => setSelectedPatientId(null)} 
                        onSave={(updated) => {
                            setPatients(patients.map(item => item.id === updated.id ? updated : item));
                            showToast("Ficha guardada!");
                        }}
                        onDelete={(id) => {
                            setPatients(patients.filter(item => item.id !== id));
                            setSelectedPatientId(null);
                            showToast("Paciente removido.");
                        }}
                        setPrintModal={setPrintModal}
                    />;
                }

                switch(view) {
                    case 'pacientes':
                        return (
                            <div className="p-10 max-w-6xl mx-auto animation-fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-4">
                                    <div>
                                        <h2 className="text-4xl font-extrabold tracking-tight">Meus Pacientes</h2>
                                        <p className="opacity-50 mt-1">Total de {patients.length} prontuários ativos</p>
                                    </div>
                                    <Button icon="plus" onClick={() => {
                                        const nid = Date.now().toString();
                                        const newP = { id: nid, name: '', evolutions: [], contact: '', email: '', birthDate: '', gender: '', address: '', rg: '' };
                                        setPatients([newP, ...patients]);
                                        setSelectedPatientId(nid);
                                    }}>Novo Paciente</Button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {patients.map(p => (
                                        <div key={p.id} onClick={() => setSelectedPatientId(p.id)} className="card p-6 cursor-pointer hover:border-blue-400 group transition-all">
                                            <div className="flex items-center gap-4 mb-4">
                                                <div className="w-12 h-12 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center font-bold text-xl" style={{color: 'var(--color-primary)'}}>
                                                    {p.name ? p.name[0].toUpperCase() : '?'}
                                                </div>
                                                <div className="flex-1 overflow-hidden">
                                                    <h3 className="font-bold truncate group-hover:text-blue-500">{p.name || 'Sem Nome'}</h3>
                                                    <p className="text-xs opacity-40 truncate">{p.contact || 'Sem contacto'}</p>
                                                </div>
                                            </div>
                                            <div className="text-[10px] uppercase font-bold opacity-30 flex justify-between">
                                                <span>{p.evolutions.length} Sessões</span>
                                                <span>{p.birthDate ? new Date(p.birthDate).toLocaleDateString() : '--'}</span>
                                            </div>
                                        </div>
                                    ))}
                                    {patients.length === 0 && <div className="col-span-full py-20 text-center opacity-20 italic">Nenhum paciente cadastrado.</div>}
                                </div>
                            </div>
                        );

                    case 'agenda':
                        return (
                            <div className="p-10 max-w-5xl mx-auto animation-fade-in">
                                <div className="flex justify-between items-center mb-10">
                                    <h2 className="text-4xl font-extrabold">Agenda Clínica</h2>
                                    <Button icon="plus" onClick={() => {
                                        const dateStr = prompt("Data e Hora (AAAA-MM-DD HH:MM):", new Date().toISOString().slice(0,16).replace('T',' '));
                                        if(!dateStr) return;
                                        const pName = prompt("Nome Completo do Paciente:");
                                        if(!pName) return;
                                        setAppointments([...appointments, { id: Date.now(), title: pName, date: dateStr, room: `Sala_${Date.now()}` }]);
                                    }}>Marcar Consulta</Button>
                                </div>
                                <div className="card overflow-hidden">
                                    <table className="w-full text-left">
                                        <thead className="bg-gray-50 dark:bg-gray-900/50 text-[10px] font-bold uppercase opacity-40">
                                            <tr>
                                                <th className="p-5">Horário</th>
                                                <th className="p-5">Paciente</th>
                                                <th className="p-5 text-right">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y dark:divide-gray-700">
                                            {appointments.map(a => (
                                                <tr key={a.id} className="hover:bg-gray-50 dark:hover:bg-gray-800/30">
                                                    <td className="p-5 font-mono text-sm">{a.date}</td>
                                                    <td className="p-5 font-bold">{a.title}</td>
                                                    <td className="p-5 text-right flex justify-end gap-2">
                                                        <button onClick={() => {setActiveVideo(a.room); setView('video');}} className="p-2 text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition-colors"><Icon name="video" /></button>
                                                        <button onClick={() => setAppointments(appointments.filter(x => x.id !== a.id))} className="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition-colors"><Icon name="trash" /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {appointments.length === 0 && <tr><td colSpan="3" className="p-10 text-center opacity-20 italic">Sem compromissos agendados.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        );

                    case 'video':
                        return (
                            <div className="h-full bg-black flex flex-col">
                                {!activeVideo ? (
                                    <div className="flex-1 flex flex-col items-center justify-center text-white p-6 text-center">
                                        <Icon name="video" size={64} className="opacity-10 mb-4 text-white" />
                                        <p className="opacity-40 mb-6">Nenhuma teleconsulta ativa no momento.</p>
                                        <Button onClick={() => setActiveVideo(`Sessao_${Date.now()}`)}>Criar Sala Instantânea</Button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="p-4 bg-gray-900 flex justify-between items-center text-white">
                                            <div className="flex items-center gap-2 text-xs font-bold text-green-400">
                                                <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                                SESSÃO SEGURA (P2P)
                                            </div>
                                            <Button variant="danger" onClick={() => setActiveVideo(null)}>Finalizar Chamada</Button>
                                        </div>
                                        <iframe src={`https://meet.jit.si/${activeVideo}`} className="flex-1 border-none" allow="camera; microphone; display-capture; autoplay"></iframe>
                                    </>
                                )}
                            </div>
                        );

                    case 'perfil':
                        return (
                            <div className="p-10 max-w-3xl mx-auto animation-fade-in">
                                <h2 className="text-4xl font-extrabold mb-10">Configurações</h2>
                                <div className="space-y-8">
                                    <div className="card p-8 space-y-6">
                                        <div className="flex flex-col sm:flex-row items-center gap-6 pb-6 border-b dark:border-gray-700">
                                            <div className="relative group shrink-0">
                                                <div className="w-24 h-24 rounded-3xl overflow-hidden bg-gray-100 dark:bg-gray-700 flex items-center justify-center border-2 border-gray-200 dark:border-gray-600">
                                                    {admin.foto ? <img src={admin.foto} className="w-full h-full object-cover" /> : <Icon name="users" size={32} className="opacity-10 text-gray-500" />}
                                                </div>
                                                <button onClick={() => fileInputRef.current.click()} className="absolute -bottom-2 -right-2 p-2 bg-white dark:bg-gray-800 rounded-xl shadow-lg border dark:border-gray-600 hover:scale-110 transition-transform">
                                                    <Icon name="camera" size={14} className="text-gray-700 dark:text-gray-300" />
                                                </button>
                                                <input type="file" ref={fileInputRef} className="hidden" accept="image/*" onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if(file) {
                                                        const reader = new FileReader();
                                                        reader.onloadend = () => setAdmin({...admin, foto: reader.result});
                                                        reader.readAsDataURL(file);
                                                    }
                                                }} />
                                            </div>
                                            <div className="flex-1 w-full space-y-3">
                                                <div className="flex flex-col">
                                                    <label className="input-label">Nome Profissional</label>
                                                    <input className="input-field" value={admin.nome} onChange={e => setAdmin({...admin, nome: e.target.value})} />
                                                </div>
                                                <div className="flex flex-col">
                                                    <label className="input-label">CRP / Identificação</label>
                                                    <input className="input-field" value={admin.crp} onChange={e => setAdmin({...admin, crp: e.target.value})} />
                                                </div>
                                                <div className="flex flex-col">
                                                    <label className="input-label">Cidade Padrão (Recibo)</label>
                                                    <input className="input-field" value={admin.cidade || ''} onChange={e => setAdmin({...admin, cidade: e.target.value})} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="flex flex-col sm:flex-row justify-between items-center gap-6">
                                            <div className="w-full">
                                                <p className="font-bold text-sm mb-3">Tema Visual</p>
                                                <div className="flex gap-3">
                                                    {Object.keys(THEMES).map(t => (
                                                        <div key={t} onClick={() => setSettings({...settings, theme: t})} 
                                                             className={`color-dot ${settings.theme === t ? 'ring-4 ring-offset-2 ring-blue-400' : ''}`}
                                                             style={{backgroundColor: THEMES[t].color}} title={THEMES[t].label} />
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex flex-row sm:flex-col items-center gap-4 sm:gap-2 shrink-0">
                                                <p className="font-bold text-sm">Modo Escuro</p>
                                                <button onClick={() => setSettings({...settings, darkMode: !settings.darkMode})} className="w-14 h-7 bg-gray-200 dark:bg-gray-700 rounded-full relative p-1 transition-colors">
                                                    <div className={`w-5 h-5 bg-white rounded-full transition-transform shadow-sm ${settings.darkMode ? 'translate-x-7' : 'translate-x-0'}`}></div>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <p className="text-[10px] text-center opacity-30">Plataforma Clínica v7.0 - Contraste de Escrita Otimizado</p>
                                </div>
                            </div>
                        );
                }
            };

            return (
                <div className="flex h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 overflow-hidden">
                    {renderSidebar()}
                    <main className="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-950">
                        {renderContent()}
                    </main>
                    {printModal.open && <PrintModal modal={printModal} setModal={setPrintModal} admin={admin} />}
                    {toast && <div className="toast">{toast}</div>}
                </div>
            );
        }

        function PatientFile({ patient, onBack, onSave, onDelete, setPrintModal }) {
            const [local, setLocal] = useState({...patient});
            const update = (f, v) => setLocal(prev => ({...prev, [f]: v}));

            return (
                <div className="p-8 max-w-4xl mx-auto animation-fade-in pb-20">
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-8 no-print gap-4">
                        <button onClick={onBack} className="flex items-center gap-2 font-bold opacity-40 hover:opacity-100 transition-all text-gray-700 dark:text-gray-300">
                            <Icon name="arrowLeft" /> Voltar
                        </button>
                        <div className="flex flex-wrap justify-center gap-2">
                            <Button variant="success" icon="save" onClick={() => onSave(local)}>Guardar</Button>
                            <Button variant="outline" icon="print" onClick={() => setPrintModal({open: true, data: local})}>Emitir Recibo</Button>
                            <Button variant="danger" icon="trash" onClick={() => confirm(`Excluir prontuário?`) && onDelete(local.id)}></Button>
                        </div>
                    </div>

                    <div className="card p-6 sm:p-10 print-area">
                        <div className="flex flex-col mb-4">
                            <label className="input-label mb-2">Nome Completo do Paciente</label>
                            <input 
                                className="patient-title-input" 
                                value={local.name} 
                                onChange={e => update('name', e.target.value)} 
                                placeholder="Digite o nome completo aqui..."
                            />
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                            <div className="flex flex-col"><label className="input-label">Contacto</label><input className="input-field" value={local.contact || ''} onChange={e => update('contact', e.target.value)} /></div>
                            <div className="flex flex-col"><label className="input-label">Data Nasc.</label><input type="date" className="input-field" value={local.birthDate || ''} onChange={e => update('birthDate', e.target.value)} /></div>
                            <div className="flex flex-col"><label className="input-label">CPF / RG</label><input className="input-field" value={local.rg || ''} onChange={e => update('rg', e.target.value)} /></div>
                            <div className="flex flex-col"><label className="input-label">E-mail</label><input className="input-field" value={local.email || ''} onChange={e => update('email', e.target.value)} /></div>
                        </div>

                        <div className="border-t dark:border-gray-700 pt-10">
                            <h3 className="text-2xl font-black mb-6">Evoluções</h3>
                            <Button icon="plus" variant="outline" className="mb-6 no-print" onClick={() => setLocal({...local, evolutions: [{ id: Date.now(), date: new Date().toLocaleDateString('pt-PT'), text: '' }, ...local.evolutions]})}>Nova Sessão</Button>
                            <div className="space-y-6">
                                {local.evolutions.map((e, idx) => (
                                    <div key={e.id} className="evolution-box">
                                        <div className="text-[10px] font-bold opacity-50 mb-2 text-gray-900">{e.date}</div>
                                        <textarea 
                                            className="w-full bg-transparent border-none focus:ring-0 p-0 text-lg leading-relaxed text-gray-900 placeholder-gray-500" 
                                            rows="3" 
                                            value={e.text} 
                                            placeholder="Descreva a evolução da sessão..."
                                            onChange={v => {
                                                const evos = [...local.evolutions];
                                                evos[idx].text = v.target.value;
                                                setLocal({...local, evolutions: evos});
                                            }} 
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function PrintModal({ modal, setModal, admin }) {
            const [receiptData, setReceiptData] = useState({
                valor: '150,00',
                valorExtenso: 'Cento e cinquenta reais',
                data: new Date().toLocaleDateString('pt-PT'),
                cidade: admin.cidade || 'São Paulo',
                pagamento: 'PIX'
            });

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 no-print overflow-y-auto">
                    <div className="flex flex-col md:flex-row gap-8 w-full max-w-6xl my-auto p-4">
                        
                        <div className="card p-8 w-full md:w-80 space-y-4 h-fit">
                            <h3 className="font-bold text-lg border-b dark:border-gray-700 pb-2">Dados do Recibo</h3>
                            <div className="space-y-3">
                                <div><label className="input-label">Valor (R$)</label><input className="input-field w-full" value={receiptData.valor} onChange={e => setReceiptData({...receiptData, valor: e.target.value})} /></div>
                                <div><label className="input-label">Valor por Extenso</label><input className="input-field w-full text-sm" value={receiptData.valorExtenso} onChange={e => setReceiptData({...receiptData, valorExtenso: e.target.value})} /></div>
                                <div><label className="input-label">Cidade</label><input className="input-field w-full" value={receiptData.cidade} onChange={e => setReceiptData({...receiptData, cidade: e.target.value})} /></div>
                                <div>
                                    <label className="input-label">Forma de Pagamento</label>
                                    <select className="input-field w-full" value={receiptData.pagamento} onChange={e => setReceiptData({...receiptData, pagamento: e.target.value})}>
                                        <option>PIX</option>
                                        <option>Dinheiro</option>
                                        <option>Cartão de Crédito</option>
                                        <option>Cartão de Débito</option>
                                        <option>Transferência</option>
                                    </select>
                                </div>
                            </div>
                            <div className="pt-4 space-y-2">
                                <Button className="w-full" icon="print" onClick={handlePrint}>Imprimir Recibo</Button>
                                <Button variant="outline" className="w-full" onClick={() => setModal({ open: false })}>Cancelar</Button>
                            </div>
                        </div>

                        <div className="bg-white text-black p-8 sm:p-12 rounded-lg shadow-2xl flex-1 print-area receipt-container min-h-[600px] flex flex-col">
                            <div className="flex justify-between items-start border-b-2 border-black pb-8 mb-8">
                                <div>
                                    <h2 className="text-2xl font-bold tracking-tighter text-black uppercase">{admin.nome}</h2>
                                    <p className="text-sm italic text-gray-700">Psicóloga Clínica</p>
                                    <p className="text-xs font-bold mt-1 text-black">CRP: {admin.crp}</p>
                                </div>
                                <div className="text-right">
                                    <h1 className="receipt-title text-4xl sm:text-5xl font-bold italic text-gray-200">Recibo</h1>
                                    <p className="font-mono text-sm mt-2 text-gray-600">Nº {Date.now().toString().slice(-6)}</p>
                                </div>
                            </div>

                            <div className="flex-1 space-y-10 text-lg leading-loose text-black">
                                <div className="flex flex-wrap items-end gap-3">
                                    <span>Recebi de</span>
                                    <span className="flex-1 border-b border-dotted border-black font-bold px-2">{modal.data.name || '(Nome Completo)'}</span>
                                </div>
                                
                                <div className="flex flex-wrap items-end gap-3">
                                    <span>a importância de R$</span>
                                    <span className="w-32 border-b border-dotted border-black font-bold px-2 text-center">{receiptData.valor}</span>
                                    <span className="px-2">( {receiptData.valorExtenso} )</span>
                                </div>

                                <div className="space-y-4">
                                    <p>Referente a serviços profissionais de <span className="font-bold">Psicoterapia Clínica</span>.</p>
                                    <p>Forma de pagamento utilizada: <span className="font-bold">{receiptData.pagamento}</span>.</p>
                                </div>
                            </div>

                            <div className="mt-20 flex flex-col items-end text-black">
                                <p className="mb-16">{receiptData.cidade}, {receiptData.data}</p>
                                <div className="w-full sm:w-80 text-center">
                                    <div className="border-t border-black mb-2"></div>
                                    <p className="font-bold text-sm uppercase">{admin.nome}</p>
                                    <p className="text-xs">CRP {admin.crp}</p>
                                    {modal.data.rg && <p className="text-[10px] opacity-50 mt-1">Identificação: {modal.data.rg}</p>}
                                </div>
                            </div>

                            <div className="mt-auto pt-8 border-t border-gray-100 text-[9px] text-center uppercase tracking-widest opacity-30 italic text-gray-500">
                                Plataforma de Gestão Clínica Profissional
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
